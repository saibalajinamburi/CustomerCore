name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Remove pywin32 since we run on Linux CI runner
        sed -i '/pywin32/d' requirements.txt
        pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
        pip install ruff pytest pytest-asyncio

    - name: Lint with Ruff
      run: ruff check src/ tests/

    - name: Run Unit Tests
      env:
        # Mock env vars so tests run in memory / sandbox
        SUPABASE_URL: "https://mock-supabase.co"
        SUPABASE_ANON_KEY: "mock-key"
        SUPABASE_SERVICE_ROLE_KEY: "mock-role-key"
        SUPABASE_DB_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        LITELLM_MASTER_KEY: "mock-litellm-key"
        OPENROUTER_API_KEY: "mock-openrouter-key"
        UPSTASH_REDIS_URL: "redis://localhost:6379"
        LANGFUSE_PUBLIC_KEY: "mock-lf-public"
        LANGFUSE_SECRET_KEY: "mock-lf-secret"
        APP_ENV: "test"
      run: |
        pytest --tb=short > pytest_failure.log 2>&1 || (
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add pytest_failure.log
          git commit -m "debug: add pytest failure log [skip ci]"
          git push origin HEAD:main
          exit 1
        )
